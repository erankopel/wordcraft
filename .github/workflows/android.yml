name: Android

# Builds the unofficial Android APK (packaging/android) on demand and attaches it to the run. It is
# not part of the release workflow: the APK is for sideloading on your own device.
#
# Signing: without secrets the APK is signed with a key made for this run, so it installs but can't
# update an earlier build. To keep one signature, add the repository secrets ANDROID_KEYSTORE_BASE64
# (base64 of your .jks file) and ANDROID_KEYSTORE_PASSWORD (also the key password). Anyone who can
# run workflows on a branch of the repository can make a run that reads those secrets, and the
# artifact of a run is readable by anyone who can read the repository: don't keep a key you care
# about in a repository other people can write to.
#
# This workflow has not been run yet: the first dispatch may need fixing (the runner's SDK, the
# first build's time against the timeout below).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android

      - name: Build the APK
        # The key is decoded and passed in this step only (not through GITHUB_ENV): package.sh
        # hands it to Gradle alone, never to the Rust build, whose crates' build scripts must not
        # see it. --install-sdk accepts the Android SDK licences for the runner's SDK, as every
        # Android CI does.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WORDCRAFT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$WORDCRAFT_KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wordcraft.jks"
            export WORDCRAFT_KEYSTORE="$RUNNER_TEMP/wordcraft.jks"
          else
            unset WORDCRAFT_KEYSTORE_PASSWORD
            echo "::warning::No signing secrets: signing with a key made for this run, so this APK can't update an earlier build."
          fi
          unset KEYSTORE_BASE64
          packaging/android/package.sh --install-sdk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcraft-android-apk
          path: |
            dist/release/*.apk
            dist/release/*.apk.sha256
          if-no-files-found: error
