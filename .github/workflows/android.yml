name: Android

# Builds the unofficial Android APK (packaging/android) when you run it, from an up to date copy of
# this fork. Not part of the release workflow: the APK is for sideloading on your own device.
#
# Run it: Actions tab, Android, Run workflow. Choose the branch to build (normally main) and:
#   sync     merge the original repository's newest commits into that branch first (the same merge
#            as the Sync upstream workflow, see .github/scripts/sync-upstream.sh). If git cannot
#            combine a file the run stops there and says which; run it again with sync off to build
#            what the branch has.
#   release  also publish the APK on the android-latest release (a pre-release that each run
#            replaces), so that the phone can download the .apk from the Releases page without the
#            zip an artifact comes in. In a public repository that page is public: anyone can
#            download the build. If you publish modified builds, read docs/brand/LICENSE-brand.txt
#            (the ArtCraft name and marks may not appear in them). Only with your own signing key (below).
# The APK is also attached to the run as an artifact (readable by anyone who can read the
# repository), with its SHA-256 file.
#
# Signing: without secrets the APK is signed with a key made for this run, so it installs but can't
# update an earlier build, and it is never published as a release. To keep one signature, add the
# repository secrets ANDROID_KEYSTORE_BASE64 (base64 of your .jks file) and ANDROID_KEYSTORE_PASSWORD
# (also the key password); the key's alias must be wordcraft (see packaging/android/README.md). Anyone
# who can run workflows on a branch of the repository can make a run that reads those secrets: don't
# keep a key you care about in a repository other people can write to. The code that is built is the
# code of the original repository you merged, with your key: you are trusting it as you trust any
# project you build.
#
# This workflow has not been run yet: the first run may need fixing (the runner's SDK, the first
# build's time against the timeout below).

on:
  workflow_dispatch:
    inputs:
      sync:
        description: "First merge the original repository's newest commits into this branch"
        type: boolean
        default: true
      release:
        description: "Also publish the APK as the android-latest release (public in a public repository)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    # Not in the original repository itself: it has nothing to merge from.
    if: ${{ inputs.sync && github.repository != 'storytold/wordcraft' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: upstream-sync-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Merge the original repository's newest commits
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
          REPORT_FILE: ${{ runner.temp }}/sync-report.md
        run: .github/scripts/sync-upstream.sh --push

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/sync-report.md" ]; then cat "$RUNNER_TEMP/sync-report.md" >> "$GITHUB_STEP_SUMMARY"; fi

  apk:
    needs: sync
    # Build after a sync, or when the sync was not asked for; not when it failed or was cancelled.
    if: ${{ !cancelled() && (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      signed: ${{ steps.build.outputs.signed }}
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      # The commit the sync left the branch at, or the branch as it was when the run started. No
      # credentials are kept in the checkout: the build runs other people's build scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android

      - name: Build the APK
        id: build
        # The key is decoded and passed in this step only (not through GITHUB_ENV): package.sh
        # hands it to Gradle alone, never to the Rust build, whose crates' build scripts must not
        # see it. --install-sdk accepts the Android SDK licences for the runner's SDK, as every
        # Android CI does.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WORDCRAFT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WANT_RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$WORDCRAFT_KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wordcraft.jks"
            export WORDCRAFT_KEYSTORE="$RUNNER_TEMP/wordcraft.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            unset WORDCRAFT_KEYSTORE_PASSWORD
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: signing with a key made for this run, so this APK can't update an earlier build."
            if [ "$WANT_RELEASE" = true ]; then
              echo "::warning::The APK is not published as a release: it is not signed with your own key."
            fi
          fi
          unset KEYSTORE_BASE64
          packaging/android/package.sh --install-sdk

      - name: Which commit this is
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcraft-android-apk
          path: |
            dist/release/*.apk
            dist/release/*.apk.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    needs: apk
    if: ${{ !cancelled() && inputs.release && needs.apk.result == 'success' && needs.apk.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish the APK on the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.apk.outputs.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag=android-latest
          mkdir out
          gh run download "$GITHUB_RUN_ID" --name wordcraft-android-apk --dir out
          # shellcheck disable=SC2016 # the backticks are Markdown
          printf 'Built from `%s` of `%s` on %s.\n\nSigned with the repository owner'"'"'s key, so it installs over an earlier build signed with it.\n\nSHA-256:\n\n```\n%s\n```\n' \
            "$SHA" "$BRANCH" "$(date -u +%F)" "$(cat out/*.apk.sha256)" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$SHA" -F force=true >/dev/null
            gh release upload "$tag" out/* --clobber
            gh release edit "$tag" --notes-file notes.md --prerelease
          else
            gh release create "$tag" out/* --target "$SHA" --title "WordCraft for Android (latest build)" --notes-file notes.md --prerelease
          fi
          echo "Published: https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
