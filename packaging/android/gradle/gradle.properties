org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.caching=false
# Maven Central answers 429 now and then from shared egress addresses: retry harder, with backoff.
systemProp.org.gradle.internal.repository.max.tentatives=12
systemProp.org.gradle.internal.repository.initial.backoff=1500
android.useAndroidX=true
android.nonTransitiveRClass=true
